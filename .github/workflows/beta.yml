name: Beta

# On-demand pre-release builds for verification before a real release:
# Actions -> Beta -> Run workflow (or: gh workflow run beta.yml --ref dev).
# Publishes a GitHub PRERELEASE tagged v<csproj-version>-beta.N. The number is
# RESERVED FIRST: beta-meta creates a DRAFT release before anything builds, so
# every asset is built carrying EXACTLY the tag's version — the two can never
# disagree. GitHub reserves a deleted release's tag name forever ("immutable
# release") while /tags hides it, so the draft creation itself is the authority
# on what's free: on that 422 the next number is taken (bounded retry).
# The Release always points at the exact commit; the final job only uploads
# assets and un-drafts. It NEVER touches the csproj — beta versions are
# command-line build inputs, and <Version> still marks real releases only (AGENTS.md).
# A FAILED run leaves its DRAFT in place (private, its tag keeps the number out
# of later runs' way); delete such drafts by hand if desired.
#
# Beta-tag deletion policy: never delete a beta tag of the CURRENT or NEXT
# release — deleting burns the name forever and later runs must skip it. Only
# prereleases of versions strictly older than the newest STABLE release are
# safe to delete.
#
# Stable installs are unaffected: install.ps1/install.sh read releases/latest,
# which excludes prereleases. Opt in with KEEPASSXC_MCP_PRERELEASE=1.
#
# The beta-bootstrap push trigger is registration only (GitHub refuses to run a
# workflow_dispatch-only file that has never run and is not on the default
# branch): `git push origin dev:refs/heads/beta-bootstrap` registers it, and the
# run itself no-ops — every job requires github.event_name == 'workflow_dispatch'.
on:
  workflow_dispatch:
  push:
    branches: [beta-bootstrap]

concurrency:
  group: beta-${{ github.ref }}
  cancel-in-progress: false   # never kill a half-published release

jobs:
  beta-meta:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Refuse to beta an untested or failed commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CONCLUSIONS=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" \
            --jq '[.check_runs[] | select(.name | startswith("test")) | .conclusion] // [] | .[]')
          if [ -z "$CONCLUSIONS" ]; then
            echo "::error::No CI test results for ${GITHUB_SHA} yet — let the CI run on this commit finish first."
            exit 1
          fi
          if echo "$CONCLUSIONS" | grep -vqx success; then
            echo "::error::CI is not green on this commit — not publishing a beta from it."
            exit 1
          fi

      - name: Reserve beta number (draft release, before any build)
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE=$(grep -oPm1 '(?<=<Version>)[^<]+' src/KeePassXCMcp/KeePassXCMcp.csproj)
          cat > NOTES.md <<EOF
          **Pre-release for verification — not a release.** Built from \`${GITHUB_REF_NAME}@${GITHUB_SHA}\`.
          Self-contained single-file builds; the external **keepassxc-cli** (KeePassXC >= 2.7.x) is still required.

            KEEPASSXC_MCP_PRERELEASE=1   # then run install.ps1 / install.sh as usual

          The default install commands (without that opt-in) keep installing the latest STABLE release.
          EOF
          # Starting candidate from live tags (a draft's tag is listed too, so a
          # prior failed run's number is already out of the way). Numbers burned
          # by DELETED releases are invisible here but stay reserved — the draft
          # creation is the authority: on that 422 take the next number.
          N=$(gh api "repos/${GITHUB_REPOSITORY}/tags" --paginate --jq '.[].name' \
              | sed -n "s/^v${BASE}-beta\.\([0-9]\+\).*/\1/p" | sort -n | tail -1)
          N=$(( ${N:-0} + 1 ))
          ERR=$(mktemp)
          for _ in $(seq 1 15); do
            TAG="v${BASE}-beta.${N}"
            if gh release create "$TAG" \
              --draft --prerelease \
              --target "${GITHUB_SHA}" \
              --title "$TAG" \
              --notes-file NOTES.md 2>"$ERR"; then
              echo "version=${BASE}-beta.${N}" >> "$GITHUB_OUTPUT"
              echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
              echo "reserved draft **${TAG}** at ${GITHUB_SHA} — every asset builds as ${BASE}-beta.${N}" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if grep -qi "immutable release" "$ERR"; then
              echo "tag ${TAG} is reserved by a deleted release — taking the next number" >&2
              N=$((N + 1))
              continue
            fi
            cat "$ERR" >&2
            exit 1
          done
          echo "::error::no free beta tag after 15 attempts starting at ${BASE}-beta.${N}" >&2
          exit 1

  beta-assets:
    needs: beta-meta
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64, linux-x64, linux-arm64, osx-x64, osx-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The shared build recipe (same action the release job uses) — the version
      # override is the only difference. It is EXACTLY the reserved tag's version.
      - uses: ./.github/actions/build-asset
        with:
          rid: ${{ matrix.rid }}
          version: ${{ needs.beta-meta.outputs.version }}
          artifact-prefix: beta-asset

  beta-publish:
    needs: [beta-meta, beta-assets]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # gh infers the repo from the git checkout — without this it fails with
      # "failed to run git: not a git repository".
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          pattern: beta-asset-*
          merge-multiple: true
          path: dist

      - name: Checksums
        run: |
          cd dist
          sha256sum keepassxc-mcp-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish the reserved prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.beta-meta.outputs.tag }}
        run: |
          # The tag was reserved (as a draft) by beta-meta, and the assets were
          # built carrying exactly this version — only upload and un-draft here.
          gh release upload "$TAG" dist/*
          gh release edit "$TAG" --draft=false
          echo "beta **${TAG}** from ${GITHUB_SHA} published" >> "$GITHUB_STEP_SUMMARY"
